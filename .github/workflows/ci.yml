# The same gate as the pre-commit hook (scripts/checks.sh) on every push and pull request.
name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: pdftotext / pdfinfo
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: uv sync --frozen
      - run: scripts/checks.sh
