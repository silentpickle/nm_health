# Rebuild the static site from every archived PDF and publish it to GitHub Pages.
# Runs on pushes to main, by hand, and from collect.yml after it archives a new report (pushes made by a workflow's
# own token don't start other workflows, so collect.yml calls this one directly).
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # collect.yml's new commit, not the commit that started the run
      - uses: astral-sh/setup-uv@v6
      - name: pdftotext / pdfinfo
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev nm-health site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
