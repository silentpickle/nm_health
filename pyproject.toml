[project]
name = "nm-health"
version = "0.2.0"
description = "Permanent history of City of Albuquerque food inspection reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
firebase = ["firebase-admin>=6.0.0"]

[project.scripts]
nm-health = "nm_health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nm_health"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
]

# --- Static analysis (house rules, plus owner 2026-11-09: "crank ruff to be crazy strict on pretty much everything") ---
[tool.ruff]
target-version = "py312"
line-length = 120
# Vendored from ~/test_qwen/house_walkthrough: kept byte-identical so fixes flow both ways; it is linted there.
extend-exclude = ["scripts/complexity.py", ".claude"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with each other: pick one of each pair.
    "D203",    # one-blank-line-before-class: conflicts with D211 (no blank line), which we keep
    "D213",    # multi-line-summary-second-line: conflicts with D212 (summary on first line), which we keep
    # Conflict with `ruff format` (ruff's documented list).
    "COM812",  # trailing comma: the formatter owns commas
    "ISC001",  # implicit string concat on one line: the formatter can produce it
    "E501",    # line length: the formatter owns wrapping; strings it cannot wrap stay readable
    "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003",
    # subprocess with a list of args (never shell=True) running pdftotext/pdfinfo from PATH is how this project reads PDFs.
    "S603", "S607",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 3   # ruff counts the function body as a level; 3 here is house "no deeper than 2"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest asserts are the point
    "INP001",  # tests/ is not a package
    "PLR2004", # handled by named constants anyway; kept for parametrize tables
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true

# New modules meet --strict. Legacy modules from the prototype get the default mode until someone touches them.
[[tool.mypy.overrides]]
module = ["nm_health.archive", "nm_health.commands", "nm_health.identity", "nm_health.database", "nm_health.settings", "nm_health.wayback", "nm_health.model", "nm_health.legacy_parser", "nm_health.tags", "nm_health.site", "nm_health.rebuild"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Baseline: prototype modules with mypy errors today. Take a module out of this list once it type-checks; never add one.
[[tool.mypy.overrides]]
module = [
    "nm_health.cli",
    "nm_health.db.firebase_sync",
    "nm_health.db.local_store",
    "nm_health.ingest.parser",
    "nm_health.ingest.normalizer",
    "nm_health.web.server",
    "nm_health.__main__",
    "tests.test_normalizer",
]
ignore_errors = true
